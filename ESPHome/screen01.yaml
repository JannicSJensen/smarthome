# Basic setup for ESP32-S3
substitutions:
  name: screen01
  friendly_name: Screen 01

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

# Enable Home Assistant API
api:
  encryption:
    key: !secret screen_api_key

# Allow Over-The-Air updates
ota:
  - platform: esphome
    password: !secret screen_ota
    id: ota_esphome

# WiFi configuration (replace with your credentials)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:

psram:
  mode: octal
  speed: 80MHz

# Time Component
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: /1  # Update every second
        then:
          - lvgl.label.update:
              id: lbl_current_time
              text: !lambda |-
                char buffer[16];
                auto now = id(homeassistant_time).now();
                snprintf(buffer, sizeof(buffer), "%02d:%02d", now.hour, now.minute);
                return buffer;
          - lvgl.label.update:
              id: lbl_current_date
              text: !lambda |-
                char buffer[32];
                auto now = id(homeassistant_time).now();
                const char* days[] = {"søndag", "mandag", "rirsdag", "onsdag", "torsdag", "fredag", "lørdag"};
                const char* months[] = {"januar", "februar", "marts", "april", "maj", "juni", "juli", "august", "september", "oktober", "november", "december"};
                const char* day_name = days[now.day_of_week - 1];
                const char* month_name = months[now.month - 1];
                const char* suffix;
                suffix = ". ";
                snprintf(buffer, sizeof(buffer), "%s %d%s %s", day_name, now.day_of_month, suffix, month_name);
                return buffer;

output:
  - platform: ledc
    pin: GPIO38
    id: GPIO38
    frequency: 100Hz

light:
  - platform: monochromatic
    output: GPIO38
    name: Backlight
    id: backlight
    restore_mode: ALWAYS_ON

i2c:
  - id: bus_a
    sda: GPIO19
    scl: GPIO45

# SPI configuration for the display
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

font:
  - file: "fonts/OpenSans-Bold.ttf"  # Adjust path if needed
    id: roboto
    size: 48
  - file: "fonts/OpenSans-Bold.ttf"
    id: roboto_50  # For time label
    size: 52
  - file: "fonts/OpenSans-Bold.ttf"
    id: roboto_20  # For date and button text
    size: 16
  - file: "fonts/OpenSans-Bold.ttf"
    id: roboto_36  # For Powerwall label, 20% smaller than roboto_50
    size: 26


# Colors (LCARS style with orange for time/date)
color:
  - id: lcars_beige
    red: 90%
    green: 80%
    blue: 60%
  - id: lcars_blue_gray
    red: 60%
    green: 70%
    blue: 80%
  - id: lcars_black
    red: 0%
    green: 0%
    blue: 0%
  - id: lcars_white
    red: 100%
    green: 100%
    blue: 100%
  - id: lcars_orange
    red: 100%
    green: 50%
    blue: 0%

display:
  - platform: st7701s
    id: my_display
    update_interval: never
    auto_clear_enabled: False
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    dimensions:
      width: 480
      height: 480
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: False
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red:
        - 11 #r1
        - 12 #r2
        - 13 #r3
        - 14 #r4
        - 0 #r5
      green:
        - 8 #g0
        - 20 #g1
        - 3 #g2
        - 46 #g3
        - 9 #g4
        - 10 #g5
      blue:
        - 4 #b1
        - 5 #b2
        - 6 #b3
        - 7 #b4
        - 15 #b5


# Touchscreen
touchscreen:
  platform: gt911
  id: my_touch
  display: my_display
  update_interval: 16ms
  transform:
  #  swap_xy: true
    mirror_x: false
    mirror_y: false
#  on_touch:
#    - lambda: |-
#        ESP_LOGI("Touch", "Touch detected at x=%d, y=%d", touch.x, touch.y);
  on_update:
    - lambda: |-
        for (auto touch: touches)  {
            if (touch.state <= 2) {
              ESP_LOGI("Touch points:", "id=%d x=%d, y=%d x.raw=%d, y.raw=%d", touch.id, touch.x, touch.y, touch.x_raw, touch.y_raw);
            }
        }
  on_touch:
    - lambda: |-
        ESP_LOGI("Touch", "Touch detected at x=%d, y=%d", touch.x, touch.y);
        
        static int last_x = -1;
        static int last_y = -1;

        if (touch.state == LV_INDEV_STATE_PR) {
          // Store the initial touch position
          if (last_x == -1 && last_y == -1) {
            last_x = touch.x;
            last_y = touch.y;
          }
        } else if (touch.state == LV_INDEV_STATE_REL) {
          // Calculate the swipe direction
          if (last_x != -1 && last_y != -1) {
            int delta_x = touch.x - last_x;
            int delta_y = touch.y - last_y;

            if (abs(delta_x) > abs(delta_y)) {
              if (delta_x > 30) {
                // Swipe right
                - lvgl.page.previous:
                    id: main_page
              } else if (delta_x < -30) {
                // Swipe left
                - lvgl.page.next:
                    id: music_page
              }
            }

            // Reset the touch positions
            last_x = -1;
            last_y = -1;
          }
        }

## Text Sensors for State Monitoring
text_sensor:
  - platform: homeassistant
    id: stue_lights_state
    entity_id: light.gruppe_stue
    on_value:
      then:
        - logger.log:
            format: "Stuen lys : %s"
            args: [ 'x.c_str()' ]
        - lambda: |-
            lv_obj_set_style_bg_color(id(btn_stue_lights), lv_color_hex(0x000000), 0);  // Reset to black
            if (x == "on" || x == "true" || x == "opened") {
              lv_obj_set_style_bg_color(id(btn_stue_lights), lv_color_hex(0x99B3CC), 0);  // lcars_blue_gray for "on"
              lv_obj_set_style_bg_opa(id(btn_stue_lights), LV_OPA_80, 0);
            } else {
              lv_obj_set_style_bg_color(id(btn_stue_lights), lv_color_hex(0xE6CC99), 0);  // lcars_beige for "off"
              lv_obj_set_style_bg_opa(id(btn_stue_lights), LV_OPA_80, 0);
            }

  - platform: homeassistant
    id: spise_lights_state
    entity_id: light.gruppe_spisebord
    on_value:
      then:
        - logger.log:
            format: "Spisebord state: %s"
            args: [ 'x.c_str()' ]
        - lambda: |-
            lv_obj_set_style_bg_color(id(btn_spisebord_room), lv_color_hex(0x000000), 0);  // Reset to black
            if (x == "on" || x == "true" || x == "opened") {
              lv_obj_set_style_bg_color(id(btn_spisebord_room), lv_color_hex(0x99B3CC), 0);  // lcars_blue_gray for "on"
              lv_obj_set_style_bg_opa(id(btn_spisebord_room), LV_OPA_80, 0);
            } else {
              lv_obj_set_style_bg_color(id(btn_spisebord_room), lv_color_hex(0xE6CC99), 0);  // lcars_beige for "off"
              lv_obj_set_style_bg_opa(id(btn_spisebord_room), LV_OPA_80, 0);
            }


# Add the image component for the new background
image:
  - file: "/config/esphome/images/background480x480.png"  # Updated path
    id: lcars_background
    type: RGB565  # As confirmed by your successful compile
    resize: 480x480


# LVGL setup with LCARS-inspired layout
lvgl:
  id: lvgl_id  # Assign an ID to the LVGL component
  displays: my_display
  touchscreens: my_touch
  on_idle:
    - timeout: 10s
      then:
        - logger.log: idle timeout
        - if:
            condition:
              lvgl.is_idle:
                timeout: 5s
            then:
              - logger.log: LVGL is idle
    - timeout: 15s
      then:
        - logger.log: idle 15s timeout  
  buffer_size: 20%
  color_depth: 16
  log_level: WARN
  pages:
    - id: main_page
      widgets:
        # Root object with the new background image
        - obj:
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: lcars_black
            bg_opa: 100%  # Fully opaque (equivalent to LV_OPA_COVER)
            border_width: 0
            border_opa: 0%  # Fully transparent border
            pad_all: 0
            radius: 0
            bg_image_src: lcars_background
            bg_image_opa: 100%  # Fully opaque background image
            bg_image_recolor_opa: 0  # No recoloring

        # Time and Date area (orange text, moved back to original left position)
        - obj:
            x: 25
            y: -10
            width: 400
            height: 80
            bg_color: lcars_black
            bg_opa: 0  # Fully transparent (equivalent to LV_OPA_TRANSP)
            radius: 0
            border_width: 0
            border_opa: 0  # Fully transparent border
            pad_all: 0
            widgets:
              - label:
                  id: lbl_current_time
                  align: LEFT_MID
                  x: 80
                  y: 5
                  text: "00:00"
                  text_font: roboto_50
                  text_color: lcars_orange
                  height: 80
              - label:
                  id: lbl_current_date
                  align: LEFT_MID
                  x: 80
                  y: 64
                  text: "Tuesday 18th March"
                  text_font: roboto_20
                  text_color: lcars_orange
                  height: 80

        # Button grid
        - obj:
            x: 80
            y: 120
            width: 380
            height: 340
            bg_color: lcars_black
            bg_opa: 0
            border_width: 0
            pad_all: 0
            layout:
              type: GRID
              grid_columns: ["175px", "175px"]
              grid_rows: ["70px", "15px", "70px", "15px", "70px"]
            widgets:
              - button:
                  id: btn_stue_lights
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 0
                  grid_cell_column_span: 1
                  grid_cell_x_align: CENTER
                  grid_cell_y_align: STRETCH
                  width: 160  
                  height: 75  
                  bg_color: lcars_blue_gray
                  bg_opa: 80%
                  radius: 20
                  border_width: 0
                  pad_all: 0
                  on_click:
                    then:
                      - logger.log: "Stue Lights button clicked!"
                      - homeassistant.action:
                          action: light.toggle
                          data:
                            entity_id: light.gruppe_stue
                  widgets:
                    - label:
                        text: "Stue"
                        align: CENTER
                        text_font: roboto_20
                        text_color: lcars_black
              - button:
                  id: btn_spisebord_room
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 0
                  grid_cell_column_span: 1
                  grid_cell_x_align: CENTER
                  grid_cell_y_align: STRETCH
                  width: 160
                  height: 70
                  bg_color: lcars_blue_gray  # Already blue_gray
                  bg_opa: 80%  # 80% opacity (204/255)
                  radius: 20
                  border_width: 0
                  pad_all: 0
                  on_click:
                    then:
                      - logger.log: "Spisestue button clicked!"
                      - homeassistant.action:
                          action: light.toggle
                          data:
                            entity_id: light.gruppe_spisebord
                  widgets:
                    - label:
                        text: "Spisebord"
                        align: CENTER
                        text_font: roboto_20
                        text_color: lcars_black
                        # y: 40

    # New page
    - id: music_page
      widgets:
        - obj:
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: lcars_blue_gray
            bg_opa: 100%  # Fully opaque
            border_width: 0
            pad_all: 0
            radius: 0
            widgets:
              - label:
                  text: "New Page"
                  align: CENTER
                  text_font: roboto_50
                  text_color: lcars_white

