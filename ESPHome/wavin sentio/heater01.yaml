binary_sensor:
  # Calling for Heat if HVAC state == HEATING
  - platform: template
    name: "${channel_1} Calling for Heat"
    id: room1_calling_for_heat
    device_class: heat
    lambda: |-
      return (id(room1_hvac_state).state == "HEATING");

