########################################################################################
# WAVIN SENTIO for Home Assistant – ESPHome (addresses aligned to Sentio SW Ver. 6)   #
########################################################################################

substitutions:
  device_name: heater-bryggers-02
  friendly_name: heater-bryggers-02
  log_level: INFO            # Changed to VERBOSE for detailed Modbus debugging
  update_interval: 10s

  # CHANNEL ID´S
  channel_1:  Bryggers Bad
  channel_2:  Bryggers
  channel_3:  Entre Bad
  channel_4:  Stuen

  # UART / RS-485 wiring (adjust if needed)
  rx_pin: 20
  tx_pin: 21

  # Wi‑Fi
  ssid_set: !secret wifi_ssid
  password_set: !secret wifi_password

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Logging
logger:
  level: ${log_level}
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: "MqDNCIkLV365+6Jg8/g9n/NfX4flImYqXkTY0nCLoKo="


ota:
  - platform: esphome
    password: "945ac67ddcae11048f6a488672b6aadb"

wifi:
  ssid: ${ssid_set}
  password: ${password_set}
  # Secure fallback hotspot
  ap:
    ssid: "Wavin Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

# RS485 / Modbus
uart:
  id: uart_modbus
  rx_pin: ${rx_pin}
  tx_pin: ${tx_pin}
  baud_rate: 19200
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_id
  uart_id: uart_modbus
  flow_control_pin: 10          # Set to your RS485 DE/RE pin if not auto‑flow
  send_wait_time: 1000ms        # Increased for better reliability with slow devices

modbus_controller:
  id: sentio_modbus_controller
  address: 1
  modbus_id: modbus_id
  update_interval: ${update_interval}
  command_throttle: 500ms       # Increased spacing between commands
  offline_skip_updates: 3       # Skip updates when device is offline


external_components:
  - source: github://nic6911/esphome_components@Wavin_Sentio
    refresh: 0s  
#  - source: github://heinekmadsen/esphome_wavinahc9000v3
#    components: [wavin_ahc9000]
#    refresh: 0s

sentio:

# =========================
#   TEXT SENSORS (mapped)
# =========================
text_sensor:
  # Room 1 HVAC state – Input Register 00102
  - platform: modbus_controller
    modbus_controller_id: sentio_modbus_controller
    name: "${channel_1} HVAC state"
    id: room1_hvac_state
    entity_category: diagnostic
    register_type: read
    address: 102                 # 00102 – General Heating/Cooling state
    response_size: 2
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t v = modbus_controller::word_from_hex_str(x, 0);
      switch (v) {
        case 1: return std::string("IDLE");
        case 2: return std::string("HEATING");
        case 3: return std::string("COOLING");
        case 4: return std::string("BLOCKED_HEATING");
        case 5: return std::string("BLOCKED_COOLING");
        default: return std::string("UNKNOWN");
      }

  # Room 2 HVAC state – Input Register 00202
  - platform: modbus_controller
    modbus_controller_id: sentio_modbus_controller
    name: "${channel_2} HVAC state"
    id: room2_hvac_state
    entity_category: diagnostic
    register_type: read
    address: 202                 # 00202
    response_size: 2
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t v = modbus_controller::word_from_hex_str(x, 0);
      switch (v) {
        case 1: return std::string("IDLE");
        case 2: return std::string("HEATING");
        case 3: return std::string("COOLING");
        case 4: return std::string("BLOCKED_HEATING");
        case 5: return std::string("BLOCKED_COOLING");
        default: return std::string("UNKNOWN");
      }

  # Room 3 HVAC state – Input Register 00202
  - platform: modbus_controller
    modbus_controller_id: sentio_modbus_controller
    name: "${channel_3} HVAC state"
    id: room3_hvac_state
    entity_category: diagnostic
    register_type: read
    address: 302                 # 00202
    response_size: 2
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t v = modbus_controller::word_from_hex_str(x, 0);
      switch (v) {
        case 1: return std::string("IDLE");
        case 2: return std::string("HEATING");
        case 3: return std::string("COOLING");
        case 4: return std::string("BLOCKED_HEATING");
        case 5: return std::string("BLOCKED_COOLING");
        default: return std::string("UNKNOWN");
      }


  # Room 1 Blocking Source – Input Register 00103
  - platform: modbus_controller
    modbus_controller_id: sentio_modbus_controller
    name: "${channel_1} Blocking Source"
    id: room1_blocking_source
    entity_category: diagnostic
    register_type: read
    address: 103                 # 00103
    response_size: 2
    raw_encode: HEXBYTES
    lambda: |-
      const uint16_t v = modbus_controller::word_from_hex_str(x, 0);
      switch (v) {
        case 0:  return std::string("NONE");
        case 1:  return std::string("UNKNOWN");
        case 2:  return std::string("CONTACT");
        case 3:  return std::string("FLOOR_TEMP");
        case 4:  return std::string("LOW_ENERGY");
        case 5:  return std::string("AIR_TEMP");
        case 6:  return std::string("DEW_POINT");
        case 7:  return std::string("OUTDOOR_TEMP");
        case 8:  return std::string("FAULT");
        case 9:  return std::string("FAULT_HTCO");
        case 10: return std::string("PERIODIC_ACTIVATION");
        default: return std::string("UNKNOWN(") + std::to_string(v) + ")";
      }

  # Room 2 Blocking Source – Input Register 00203
  - platform: modbus_controller
    modbus_controller_id: sentio_modbus_controller
    name: "${channel_2} Blocking Source"
    id: room2_blocking_source
    entity_category: diagnostic
    register_type: read
    address: 203                 # 00203
    response_size: 2
    raw_encode: HEXBYTES
    lambda: |-
      const uint16_t v = modbus_controller::word_from_hex_str(x, 0);
      switch (v) {
        case 0:  return std::string("NONE");
        case 1:  return std::string("UNKNOWN");
        case 2:  return std::string("CONTACT");
        case 3:  return std::string("FLOOR_TEMP");
        case 4:  return std::string("LOW_ENERGY");
        case 5:  return std::string("AIR_TEMP");
        case 6:  return std::string("DEW_POINT");
        case 7:  return std::string("OUTDOOR_TEMP");
        case 8:  return std::string("FAULT");
        case 9:  return std::string("FAULT_HTCO");
        case 10: return std::string("PERIODIC_ACTIVATION");
        default: return std::string("UNKNOWN(") + std::to_string(v) + ")";
      }

  # Room 3 Blocking Source – Input Register 00203
  - platform: modbus_controller
    modbus_controller_id: sentio_modbus_controller
    name: "${channel_3} Blocking Source"
    id: room3_blocking_source
    entity_category: diagnostic
    register_type: read
    address: 303                 # 00203
    response_size: 2
    raw_encode: HEXBYTES
    lambda: |-
      const uint16_t v = modbus_controller::word_from_hex_str(x, 0);
      switch (v) {
        case 0:  return std::string("NONE");
        case 1:  return std::string("UNKNOWN");
        case 2:  return std::string("CONTACT");
        case 3:  return std::string("FLOOR_TEMP");
        case 4:  return std::string("LOW_ENERGY");
        case 5:  return std::string("AIR_TEMP");
        case 6:  return std::string("DEW_POINT");
        case 7:  return std::string("OUTDOOR_TEMP");
        case 8:  return std::string("FAULT");
        case 9:  return std::string("FAULT_HTCO");
        case 10: return std::string("PERIODIC_ACTIVATION");
        default: return std::string("UNKNOWN(") + std::to_string(v) + ")";
      }

# =========================
#         SENSORS
# =========================
sensor:
  
  # Room 1 – Input Registers 00104..00106
  - platform: modbus_controller
    modbus_controller_id: sentio_modbus_controller
    name: "${channel_1} Air mode"
    id: room1_mode
    register_type: read
    address: 102

  - platform: modbus_controller
    modbus_controller_id: sentio_modbus_controller
    name: "${channel_1} temperatur"
    id: room1_temperature
    register_type: read
    address: 104                 # 00104 – Air temperature
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - multiply: 0.01            # Adjust if your unit uses a different scale

  - platform: modbus_controller
    modbus_controller_id: sentio_modbus_controller
    name: "${channel_1} gulv temperatur"
    id: room1_floor_temperature
    register_type: read
    address: 105                 # 00105 – Floor temperature
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: sentio_modbus_controller
    name: "${channel_1} luftfugtighed"
    id: room1_humidity
    register_type: read
    address: 106                 # 00106 – Relative humidity
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: humidity
    accuracy_decimals: 1
